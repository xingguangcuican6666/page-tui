                                                value: username
      tab:
        - if:
            condition: { equals: [ state.focus, username ] }
            then:
              - set:
                  path: state.focus
                  value: password
            else:
              - if:
                  condition: { equals: [ state.focus, password ] }
                  then:
                    - set:
                        path: state.focus
                        value: passwordConfirm
                  else:
                    - if:
                        condition: { equals: [ state.focus, passwordConfirm ] }
                        then:
                          - set:
                              path: state.focus
                              value: rootMode
                        else:
                          - if:
                              condition: { equals: [ state.focus, rootMode ] }
                              then:
                                - if:
                                    condition: { equals: [ state.rootPasswordModeSelected, 1 ] }
                                    then:
                                      - set:
                                          path: state.focus
                                          value: rootPassword
                                    else:
                                      - set:
                                          path: state.focus
                                          value: hostname
                              else:
                                - if:
                                    condition: { equals: [ state.focus, rootPassword ] }
                                    then:
                                      - set:
                                          path: state.focus
                                          value: rootPasswordConfirm
                                    else:
                                      - if:
                                          condition: { equals: [ state.focus, rootPasswordConfirm ] }
                                          then:
                                            - set:
                                                path: state.focus
                                                value: hostname
                                          else:
                                            - set:
                                                path: state.focus
                                                value: username
      enter:
        - if:
            condition: { equals: [ state.focus, username ] }
            then:
              - set:
                  path: state.focus
                  value: password
            else:
              - if:
                  condition: { equals: [ state.focus, password ] }
                  then:
                    - set:
                        path: state.focus
                        value: passwordConfirm
                  else:
                    - if:
                        condition: { equals: [ state.focus, passwordConfirm ] }
                        then:
                          - set:
                              path: state.focus
                              value: rootMode
                        else:
                          - if:
                              condition: { equals: [ state.focus, rootMode ] }
                              then:
                                - if:
                                    condition: { equals: [ state.rootPasswordModeSelected, 1 ] }
                                    then:
                                      - set:
                                          path: state.focus
                                          value: rootPassword
                                    else:
                                      - set:
                                          path: state.focus
                                          value: hostname
                              else:
                                - if:
                                    condition: { equals: [ state.focus, rootPassword ] }
                                    then:
                                      - set:
                                          path: state.focus
                                          value: rootPasswordConfirm
                                    else:
                                      - if:
                                          condition: { equals: [ state.focus, rootPasswordConfirm ] }
                                          then:
                                            - set:
                                                path: state.focus
                                                value: hostname
                                          else:
                                            - if:
                                                condition:
                                                  any:
                                                    - empty: state.username
                                                    - empty: state.password
                                                    - empty: state.passwordConfirm
                                                    - empty: state.hostname
                                                then:
                                                  - set:
                                                      path: state.status
                                                      value: 用户名、用户密码、确认密码和主机名都不能为空
                                                else:
                                                  - if:
                                                      condition: { notEquals: [ state.password, state.passwordConfirm ] }
                                                      then:
                                                        - set:
                                                            path: state.status
                                                            value: 两次输入的用户密码不一致
                                                      else:
                                                        - if:
                                                            condition: { equals: [ state.rootPasswordModeSelected, 1 ] }
                                                            then:
                                                              - if:
                                                                  condition:
                                                                    any:
                                                                      - empty: state.rootPassword
                                                                      - empty: state.rootPasswordConfirm
                                                                  then:
                                                                    - set:
                                                                        path: state.status
                                                                        value: root 密码和确认密码不能为空
                                                                  else:
                                                                    - if:
                                                                        condition: { notEquals: [ state.rootPassword, state.rootPasswordConfirm ] }
                                                                        then:
                                                                          - set:
                                                                              path: state.status
                                                                              value: 两次输入的 root 密码不一致
                                                                        else:
                                                                          - set:
                                                                              path: data.install.newUser.name
                                                                              value: { bind: state.username }
                                                                          - set:
                                                                              path: data.install.newUser.password
                                                                              value: { bind: state.password }
                                                                          - set:
                                                                              path: data.install.rootPassword
                                                                              value: { bind: state.rootPassword }
                                                                          - set:
                                                                              path: data.install.rootPasswordSameAsUser
                                                                              value: false
                                                                          - set:
                                                                              path: data.install.hostname
                                                                              value: { bind: state.hostname }
                                                                          - set:
                                                                              path: data.install.userReady
                                                                              value: true
                                                                          - set:
                                                                              path: state.saved
                                                                              value: true
                                                                          - set:
                                                                              path: state.status
                                                                              value: 用户、root 密码和主机名已保存，可以进入后续安装步骤
                                                            else:
                                                              - set:
                                                                  path: data.install.newUser.name
                                                                  value: { bind: state.username }
                                                              - set:
                                                                  path: data.install.newUser.password
                                                                  value: { bind: state.password }
                                                              - set:
                                                                  path: data.install.rootPassword
                                                                  value: { bind: state.password }
                                                              - set:
                                                                  path: data.install.rootPasswordSameAsUser
                                                                  value: true
                                                              - set:
                                                                  path: data.install.hostname
                                                                  value: { bind: state.hostname }
                                                              - set:
                                                                  path: data.install.userReady
                                                                  value: true
                                                              - set:
                                                                  path: state.saved
                                                                  value: true
                                                              - set:
                                                                  path: state.status
                                                                  value: 用户、root 密码和主机名已保存，可以进入后续安装步骤
    on:
      enter:
        - set:
            path: state.username
            value: { bind: data.install.newUser.name }
        - set:
            path: state.password
            value: { bind: data.install.newUser.password }
        - set:
            path: state.rootPassword
            value: { bind: data.install.rootPassword }
        - set:
            path: state.rootPasswordConfirm
            value: { bind: data.install.rootPassword }
        - set:
            path: state.hostname
            value: { bind: data.install.hostname }
        - if:
            condition: { equals: [ data.install.rootPasswordSameAsUser, false ] }
            then:
              - set:
                  path: state.rootPasswordModeSelected
                  value: 1
  bye:
    title: 真的要离开吗 >.<
    state:
      {
        local: { item: [ { title: 1. 是的, done: false }, { title: 2. 补药, done: false } ] },
        selected: 0
      }
    layout:
      type: column
      children:
        [
          {
              type: panel,
              title: "真的要离开吗 >.<",
              child:
                {
                  type: list,
                  items: state.local.item,
                  selected: state.selected,
                  label: "{{ item.title }}"
                }
            },
          { type: text, value: ↑/↓ 选择   Enter 选择   Esc 返回, style: muted }
        ]
    keys:
      up:
        - move:
            path: state.selected
            by: -1
            list: state.local.item
      down:
        - move:
            path: state.selected
            by: 1
            list: state.local.item
      enter:
        - if:
            condition: { equals: [ $state.selected, 0 ] }
            then:
              - quit: 0
            else:
              - pop: {}
      escape:
        - pop: {}
i18n:
  locale: zh-CN
  fallback: zh-CN
  locales:
