initial: home

# data 是整个应用都能使用的数据。
data:
  tasks:
    - title: "看懂页面布局"
      done: true
      detail: "先理解 column、panel、list 的嵌套关系。"
    - title: "学习变量绑定"
      done: false
      detail: "页面使用 data、state、params 三种变量。"
    - title: "做一个自己的 TUI"
      done: false
      detail: "复制这个 YAML 文件，替换成自己的页面。"

pages:
  home:
    title: "任务列表"

    # state 是 home 页面自己的变量。
    state:
      selected: 0
      notice: ""

    # layout 从上到下书写，就是屏幕从上到下显示的顺序。
    layout:
      type: column
      padding: [1, 2]
      children:
        - type: text
          value: "PAGE TUI / 初学者示例"
          style: title

        - type: text
          value: "↑/↓ 选择   Enter 查看   n 新建   d 删除   Space 完成   q 退出"
          style: muted

        - type: divider

        - type: panel
          title: "任务（{{ count(data.tasks) }} 条）"
          flex: true
          child:
            type: list
            items: data.tasks
            selected: state.selected
            label: "{{ if(item.done, '✓', '○') }} {{ item.title }}"
            description: "{{ if(item.done, '已完成', '未完成') }}"
            emptyText: "还没有任务"

        - type: text
          bind: state.notice
          style: success
          visible: state.notice

        - type: text
          value: "变量示例：state.selected 是当前选中的序号"
          style: muted

    # keys 把按键连接到动作。不需要写 onKey 函数。
    keys:
      up:
        - move:
            path: state.selected
            by: -1
            list: data.tasks

      down:
        - move:
            path: state.selected
            by: 1
            list: data.tasks

      enter:
        - push:
            page: detail
            params:
              task:
                itemAt:
                  list: data.tasks
                  index: state.selected

      n:
        - push:
            page: create

      d:
        - remove:
            list: data.tasks
            index: state.selected
        - move:
            path: state.selected
            by: 0
            list: data.tasks
        - set:
            path: state.notice
            value: "已删除当前任务"

      space:
        - toggle:
            list: data.tasks
            index: state.selected
            field: done

  detail:
    title: "{{ params.task.title }}"

    # params 是 home 页面 push 时传进来的数据。
    layout:
      type: column
      padding: [1, 2]
      children:
        - type: text
          value: "任务详情"
          style: title

        - type: panel
          title: "Detail"
          flex: true
          child:
            type: column
            gap: 1
            children:
              - type: text
                template: "标题：{{ params.task.title }}"
              - type: text
                template: "状态：{{ if(params.task.done, '已完成', '未完成') }}"
              - type: divider
              - type: text
                bind: params.task.detail
                style: muted

        - type: text
          value: "Enter 切换完成状态   Esc 返回"
          style: muted

    keys:
      enter:
        - toggle:
            path: params.task.done
        - pop:
            result:
              updated: true

      escape:
        - pop

  create:
    title: "新建任务"

    state:
      title: ""
      error: ""

    layout:
      type: column
      padding: [1, 2]
      children:
        - type: text
          value: "新建任务"
          style: title

        - type: panel
          title: "Create"
          flex: true
          child:
            type: column
            gap: 1
            children:
              - type: text
                value: "任务名称"
              - type: input
                bind: state.title
                placeholder: "请输入任务名称"
              - type: text
                bind: state.error
                style: danger
                visible: state.error
              - type: text
                value: "直接输入文字；Enter 保存；Esc 取消"
                style: muted

        - type: text
          value: "变量示例：state.title 是输入框的内容"
          style: muted

    keys:
      character:
        - append:
            path: state.title
            value:
              bind: key.value
        - set:
            path: state.error
            value: ""

      backspace:
        - backspace:
            path: state.title
        - set:
            path: state.error
            value: ""

      enter:
        - if:
            condition:
              notEmpty: state.title
            then:
              - append:
                  list: data.tasks
                  value:
                    title:
                      template: "{{ state.title }}"
                    done: false
                    detail: "由 YAML 页面创建"
              - pop:
                  result:
                    created: true
            else:
              - set:
                  path: state.error
                  value: "任务名称不能为空"

      escape:
        - pop
